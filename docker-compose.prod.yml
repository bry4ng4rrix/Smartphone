services:
  db:
    image: postgres:15-alpine
    container_name: smart_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-stock_db}
      POSTGRES_USER: ${DB_USER:-stock}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stock_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Pas de `ports:` ici volontairement : Postgres n'a besoin d'être joint
    # que par `backend` sur le réseau interne du projet (hôte `db`) — ne pas
    # publier sur l'hôte évite toute collision avec un Postgres d'un autre
    # projet sur le même VPS (§2 roadmap.md).

  redis:
    image: redis:7-alpine
    container_name: smart_redis
    restart: unless-stopped
    # Même principe que `db` ci-dessus : uniquement joint par `backend` via
    # `redis://redis:6379/0` sur le réseau interne, jamais publié sur l'hôte.

  backend:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: smart_backend
    environment:
      DJANGO_SETTINGS_MODULE: Stock.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost 127.0.0.1}
      DB_ENGINE: ${DB_ENGINE:-django.db.backends.postgresql}
      DB_NAME: ${DB_NAME:-stock_db}
      DB_USER: ${DB_USER:-stock}
      DB_PASSWORD: ${DB_PASSWORD:-stock_password}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3010}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3010}
    ports:
      # Port hôte configurable — défaut volontairement non-standard (pas
      # 8000) pour ne pas entrer en collision avec un autre projet déjà sur
      # ce Docker partagé. Changer BACKEND_PORT dans .env au besoin.
      - "${BACKEND_PORT:-8010}:8010"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["daphne", "-b", "0.0.0.0", "-p", "8010", "Stock.asgi:application"]
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_DJANGO_API_URL: ${NEXT_PUBLIC_DJANGO_API_URL}
    container_name: smart_frontend
    environment:
      # `next start` écoute sur 3000 par défaut — sans ce PORT, le conteneur
      # n'écouterait pas sur 3010, alors que le mapping ci-dessous transfère
      # le trafic hôte vers le port conteneur 3010 (rien n'y répondrait).
      PORT: "3010"
    ports:
      # Même logique que BACKEND_PORT ci-dessus.
      - "${FRONTEND_PORT:-3010}:3010"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
