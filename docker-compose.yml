services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: smart_backend
    environment:
      DJANGO_SETTINGS_MODULE: Stock.settings
      DEBUG: "True"
      ALLOWED_HOSTS: "157.173.103.147 localhost 127.0.0.1 0.0.0.0"
      DB_ENGINE: "django.db.backends.sqlite3"
      CORS_ALLOWED_ORIGINS: "http://157.173.103.147:3010 http://localhost:3010"
      CSRF_TRUSTED_ORIGINS: "http://157.173.103.147 http://157.173.103.147:3010 http://157.173.103.147:8010 http://localhost"
    command: daphne -b 0.0.0.0 -p 8010 Stock.asgi:application
    volumes:
      - .:/app
    ports:
      - "8010:8010"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: smart_frontend
    working_dir: /app/frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://157.173.103.147:8010/api"
      NEXT_PUBLIC_DJANGO_API_URL: "http://157.173.103.147:8010/api"
      # `next start` écoute sur 3000 par défaut — sans ce PORT, rien
      # n'écouterait sur 3010 malgré le mapping ci-dessous.
      PORT: "3010"
    command: sh -c "npm install && npm run build && npm start"
    volumes:
      - .:/app
    ports:
      - "3010:3010"
    depends_on:
      - backend
    restart: unless-stopped
