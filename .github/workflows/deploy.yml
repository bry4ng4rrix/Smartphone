name: Deploy smart

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        # Mirrors what frontend/Dockerfile runs (`npm install && npm run
        # build`) so a failure here means the actual deploy would also fail —
        # catch it before touching the server instead of finding out from a
        # crash-looping container. NEXT_PUBLIC_DJANGO_API_URL isn't set here
        # (no secrets in this advisory build), so it only validates the build
        # itself, not the real production API URL.
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Type-check frontend (advisory)
        # Next.js is configured with ignoreBuildErrors: true, so `next build`
        # above doesn't catch type errors — this makes them visible in the
        # log without blocking on the pre-existing type debt.
        working-directory: frontend
        continue-on-error: true
        run: npx tsc --noEmit

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd /home/smart/Smartphone

            echo "Updating repository (code only, from origin/main)..."
            git fetch origin main
            git reset --hard origin/main

            # .env n'est jamais commité (secrets) — doit déjà exister sur le
            # serveur, copié à la main une fois (voir roadmap.md § Sécurité).
            if [ ! -f .env ]; then
              echo "ERREUR : .env introuvable dans /home/smart/Smartphone — copiez-le manuellement avant de redéployer (voir roadmap.md)." >&2
              exit 1
            fi

            # Ce projet cohabite avec d'autres sur ce Docker (ports non-standards
            # 8010/3010, Postgres/Redis jamais exposés à l'hôte — voir
            # docker-compose.prod.yml) : toujours cibler ce fichier explicitement,
            # jamais le docker-compose.yml par défaut (SQLite, ports 8000/3000).
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "Building images..."
            $COMPOSE build

            echo "Stopping old containers..."
            $COMPOSE down

            echo "Starting containers..."
            $COMPOSE up -d

            echo "Running migrations..."
            $COMPOSE exec -T backend python manage.py migrate

            echo "Collecting static files..."
            $COMPOSE exec -T backend python manage.py collectstatic --noinput || true

            echo "Deployment completed."
          EOF
